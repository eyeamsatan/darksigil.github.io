<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Sigil Studios</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Reenie+Beanie&family=Fontdiner+Swanky&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/player.css">
    <link rel="stylesheet" href="css/views.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="#/" class="nav-logo-link">
                    <span class="nav-logo-text display-brand">DARK SIGIL STUDIOS</span>
                </a>
            </div>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li class="nav-item">
                    <a href="#/" class="nav-link" data-route="/">Home</a>
                </li>
                <li class="nav-item">
                    <a href="#/artists" class="nav-link" data-route="/artists">Artists</a>
                </li>
                <li class="nav-item">
                    <a href="#/music" class="nav-link" data-route="/music">Music</a>
                </li>
                <li class="nav-item">
                    <a href="#/about" class="nav-link" data-route="/about">About</a>
                </li>
                <li class="nav-item">
                    <a href="#/contact" class="nav-link" data-route="/contact">Contact</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- App Content -->
    <main id="app" class="app-main">
        <!-- Content loaded dynamically by router -->
    </main>

    <!-- Global Player -->
    <div class="global-player" id="globalPlayer">
        <div class="player-container">
            <div class="player-info">
                <img src="assets/images/covers/cover1.svg" alt="Track cover" class="player-cover" id="playerCover">
                <div class="player-text">
                    <div class="player-title" id="playerTitle">Select a track</div>
                    <div class="player-artist" id="playerArtist">Dark Sigil Studios</div>
                </div>
            </div>
            <div class="player-controls">
                <button class="player-btn" id="prevBtn" aria-label="Previous track">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                    </svg>
                </button>
                <button class="player-btn player-btn-play" id="playBtn" aria-label="Play/Pause">
                    <svg id="playIcon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg id="pauseIcon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>
                <button class="player-btn" id="nextBtn" aria-label="Next track">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                    </svg>
                </button>
            </div>
            <div class="player-progress">
                <span class="player-time" id="currentTime">0:00</span>
                <input type="range" class="progress-bar" id="progressBar" min="0" max="100" value="0" step="1">
                <span class="player-time" id="duration">0:00</span>
            </div>
            <div class="player-volume">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
                <input type="range" class="volume-bar" id="volumeBar" min="0" max="100" value="70">
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <!-- Scripts -->
    <script src="js/artists.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/player.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
